    <p>Babu Somasundaram — Co-Founder &amp; Architect at <a href="https://ogplabs.com">OGP Labs</a>.

    <h2>Two products. Both live.</h2>
    <p><a href="https://consilo.ai">Consilo</a> — the AI operating system for a small business:
    autonomous agents for email, social and calendar, an AI Council running four frontier models
    against one strategic question in parallel, and a generation suite grounded in the customer's
    own context. My build: multi-model routing over OpenRouter, the pgvector retrieval store, and
    the agent runtime.</p>
    <p><a href="https://designduel.ai">DesignDuel</a> — AI website and app design that produces
    every direction at once: parallel candidates, each from a different angle. My build: the
    parallel generation pipeline with SSE streaming, an isolated containerised render service, and
    an OAuth-secured MCP server exposing the design system to coding agents.</p>
    <h2>Agents carry the build. The release gate stays human.</h2>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ht:600\">DesignDuel<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#a4a4af;text-wrap:pretty\">AI website and app design that produces every direction at once — parallel candidates, each from a different model, that a designer or agency can compare on one canvas, refine, and hand to a client.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#f4f4f5;text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">My build — <\u002Fspan>the parallel generation pipeline with SSE streaming, an isolated containerised render service, and an OAuth-secured MCP server exposing the design system to coding agents.<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b8b95\">\n            <span>1,482 commits<\u002Fspan><span>361 merges<\u002Fspan><span>1,654 tests<\u002Fspan><span>34,408 agent turns<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://designduel.ai\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a494ff\" style-hover=\"color:#ffffff\">Visit designduel.ai ↗<\u002Fa>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showProcess }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"method\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:28ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">Agents carry the build. The <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#c8ff33\">release gate<\u002Fspan> stays human.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">02 — Method<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(14px,1.6vw,20px)\">\n        <sc-for list=\"{{ method }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"border:1px solid rgba(255,255,255,.09);border-radius:24px;background:rgba(255,255,255,.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.055)\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:#c8ff33\">{{ m.no }}<\u002Fdiv>\n            <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">{{ m.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.62;color:#a4a4af;text-wrap:pretty\">{{ m.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"track\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:24ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">Seventeen years, mostly at the <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#8f7bff\">architecture<\u002Fspan> end.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">03 — Track record<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(255,255,255,.09);border-radius:26px;background:rgba(255,255,255,.022);overflow:hidden\">\n        <sc-for list=\"{{ roles }}\" as=\"role\" hint-placeholder-count=\"7\">\n          <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr);gap:clamp(14px,2.2vw,32px);padding:clamp(22px,2.4vw,30px) clamp(20px,2.6vw,34px);border-top:1px solid rgba(255,255,255,.07);transition:background .25s ease\" style-hover=\"background:rgba(255,255,255,.04)\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#c8ff33;padding-top:6px\">{{ role.years }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <h3 style=\"margin:0;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.025em;font-weight:600\">{{ role.title }}<\u002Fh3>\n              <div style=\"display:flex;flex-wrap:wrap;gap:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8b8b95;line-height:1.6\"><span>{{ role.org }}<\u002Fspan><span style=\"color:#4d4d57\">·<\u002Fspan><span style=\"color:#6f6f7a\">{{ role.place }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n                <ul style=\"margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ role.points }}\" as=\"point\" hint-placeholder-count=\"2\">\n                    <li style=\"font-size:15.5px;line-height:1.62;color:#a4a4af;padding-left:18px;position:relative;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:#4d4d57\">—<\u002Fspan>{{ point }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr);gap:clamp(14px,2.2vw,32px);padding:clamp(22px,2.4vw,30px) clamp(20px,2.6vw,34px);border-top:1px solid rgba(255,255,255,.07)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#c8ff33;padding-top:6px\">2005 – 2009<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <h3 style=\"margin:0;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.025em;font-weight:600\">B.E. Computer Science<\u002Fh3>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#8b8b95;line-height:1.6\">Kamaraj College of Engineering &amp; Technology · Anna University <span style=\"color:#6f6f7a\">· Chennai, India<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"stack\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:26ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">A boring, proven stack — plus the <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#c8ff33\">AI layer<\u002Fspan> on top.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">04 — Stack<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(14px,1.6vw,20px)\">\n        <sc-for list=\"{{ stack }}\" as=\"group\" hint-placeholder-count=\"6\">\n          <div data-reveal=\"\" style=\"border:1px solid rgba(255,255,255,.09);border-radius:24px;background:rgba(255,255,255,.03);padding:clamp(22px,2.4vw,28px);display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8ff33\">{{ group.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"8\">\n                <span style=\"font-size:13.5px;line-height:1.2;color:#d6d6de;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.02);padding:8px 12px;border-radius:999px;transition:border-color .2s ease,color .2s ease\" style-hover=\"border-color:rgba(200,255,51,.55);color:#c8ff33\">{{ item }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"drive\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:24ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">A city you can <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#c8ff33\">actually drive<\u002Fspan>, built from map data.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">05 — Off the clock<\u002Fdiv>\n      <\u002Fdiv>\n      <article data-reveal=\"\" style=\"position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:26px;background:radial-gradient(120% 90% at 0% 0%,rgba(200,255,51,.12),rgba(255,255,255,.02) 55%);padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:20px;transition:border-color .25s ease,transform .4s cubic-bezier(.16,.84,.44,1)\" style-hover=\"border-color:rgba(200,255,51,.45);transform:translateY(-5px)\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8ff33\">trivandrum night drive<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#c8ff33\"><span style=\"width:6px;height:6px;border-radius:50%;background:#c8ff33;display:inline-block;animation:om-live 2.4s ease-in-out infinite\"><\u002Fspan>Playable<\u002Fdiv>\n        <\u002Fdiv>\n        <h3 style=\"margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;font-weight:600\">415 km² of Thiruvananthapuram, in one file<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#a4a4af;text-wrap:pretty\">A top-down night drive over the real city, baked out of OpenStreetMap. Pick a start and a destination, follow the arrow, and the trail prints as a journey receipt — distance, detour ratio, time over the limit, landmarks passed. No framework, no bundler, no dependencies, and no network calls once it loads.<\u002Fp>\n        <p style=\"margin:0;font-size:16px;line-height:1.6;color:#f4f4f5;text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8b8b95\">The point — <\u002Fspan>every line on that receipt is computed from geometry. The only generated sentence is the title. Knowing where a model earns its place is most of the job.<\u002Fp>\n        <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(255,255,255,.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b8b95\">\n          <span>31,702 road pieces<\u002Fspan><span>117,163 buildings<\u002Fspan><span>2,426 landmarks<\u002Fspan><span>0 dependencies<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"https://babu.work/trivandrum-night-drive/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#c8ff33\" style-hover=\"color:#ffffff\">Drive it ↗ <span style=\"color:#8b8b95;letter-spacing:.06em\">— 4.5 MB, best on wifi<\u002Fspan><\u002Fa>\n      <\u002Farticle>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"margin-top:clamp(48px,7vw,96px);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:28px;background:linear-gradient(180deg,rgba(200,255,51,.08),rgba(255,255,255,.015));padding:clamp(32px,4.4vw,72px);display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,64px);justify-content:space-between;align-items:flex-end\">\n      <div data-reveal=\"\" style=\"flex:1 1 440px;min-width:min(100%,280px);display:flex;flex-direction:column;gap:24px\">\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c8ff33\">06 — Contact<\u002Fdiv>\n        <h2 style=\"margin:0;max-width:22ch;font-size:clamp(32px,5.4vw,68px);line-height:.98;letter-spacing:-.045em;font-weight:600\">Building something that has to be <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:#c8ff33\">right<\u002Fspan> the first time?<\u002Fh2>\n        <p style=\"margin:0;max-width:52ch;font-size:clamp(16px,1.6vw,18px);line-height:1.6;color:#a4a4af;text-wrap:pretty\">A 0→1 product build, an architecture review, or an AI-native workflow you want set up properly. A message on LinkedIn reaches me directly.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <a href=\"https://linkedin.com/in/babusomasundaram\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:#c8ff33;color:#0a0a0c;padding:16px 26px;border-radius:999px;transition:transform .25s cubic-bezier(.16,.84,.44,1),background .2s ease\" style-hover=\"background:#ffffff;transform:translateY(-2px)\">Message me on LinkedIn ↗<\u002Fa>\n          <a href=\"Babu-Somasundaram-Resume.pdf\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#f4f4f5;padding:16px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.16);transition:border-color .22s ease,color .22s ease\" style-hover=\"border-color:#c8ff33;color:#c8ff33\">Résumé (PDF) ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-delay=\"120\" style=\"flex:1 1 220px;display:flex;flex-direction:column;gap:12px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8b8b95;line-height:1.7\">\n        <div>Trivandrum, India · Remote / Global<\u002Fdiv>\n        <div><a href=\"https://ogplabs.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#8b8b95\" style-hover=\"color:#c8ff33\">ogplabs.com ↗<\u002Fa><\u002Fdiv>\n        <div><a href=\"Babu-Somasundaram-Resume.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#8b8b95\" style-hover=\"color:#c8ff33\">Résumé (PDF) ↗<\u002Fa><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"padding:32px 4px 40px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#5c5c66\">\n      <span>Babu Somasundaram — Co-Founder &amp; Architect, OGP Labs PTE. LTD.<\u002Fspan>\n      <span>© 2026<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280},&quot;showProcess&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;timelineDetail&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;detailed&quot;,&quot;roles-only&quot;],&quot;default&quot;:&quot;detailed&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sections&quot;},&quot;cursorGlow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this._t = setTimeout(() => this.runMotion(), 60);\n  }\n  componentWillUnmount() {\n    clearTimeout(this._t);\n    (this._ios || []).forEach((io) => io.disconnect());\n    if (this._onScroll) window.removeEventListener(\"scroll\", this._onScroll);\n    if (this._onMove) document.removeEventListener(\"mousemove\", this._onMove);\n  }\n  runMotion() {\n    const bar = document.querySelector(\"[data-scrollbar]\");\n    if (bar) {\n      this._onScroll = () => {\n        const h = document.documentElement.scrollHeight - window.innerHeight;\n        bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + \"%\";\n      };\n      window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n      this._onScroll();\n    }\n\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n    if ((this.props.cursorGlow ?? true) && !reduce) {\n      const host = document.querySelector(\"[data-glow]\");\n      const layer = document.querySelector(\"[data-glowlayer]\");\n      if (host && layer) {\n        this._onMove = (e) => {\n          const r = host.getBoundingClientRect();\n          const x = ((e.clientX - r.left) / r.width) * 100;\n          const y = ((e.clientY - r.top) / r.height) * 100;\n          if (x < -10 || x > 110 || y < -10 || y > 110) return;\n          layer.style.background =\n            \"radial-gradient(460px circle at \" + x + \"% \" + y + \"%,rgba(200,255,51,.18),transparent 70%)\";\n        };\n        document.addEventListener(\"mousemove\", this._onMove, { passi

<script data-patch="theme">(function(){
  var KEY='theme', mq=window.matchMedia('(prefers-color-scheme: dark)');
  function pref(){try{var p=localStorage.getItem(KEY);return p==='dark'||p==='system'?p:'light'}catch(e){return 'light'}}
  function apply(p){var d=document.documentElement;d.setAttribute('data-theme-pref',p);d.setAttribute('data-theme',p==='system'?(mq.matches?'dark':'light'):p);
    document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-theme-set')===p?'true':'false')})}
  window.__applyTheme=function(){apply(pref())};
  apply(pref());
  if(!window.__themeWired){window.__themeWired=1;
    document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-set]');if(!b)return;var p=b.getAttribute('data-theme-set');try{localStorage.setItem(KEY,p)}catch(x){}apply(p)});
    if(mq.addEventListener)mq.addEventListener('change',function(){if(pref()==='system')apply('system')});
    new MutationObserver(function(){var d=document.documentElement;if(!d.hasAttribute('data-theme-pref'))apply(pref())}).observe(document,{childList:true});}
})();</script>

    <h1>I ship AI products end to end — architecture to production.</h1>
    <p>Babu Somasundaram — Co-Founder &amp; Architect at <a href="https://ogplabs.com">OGP Labs</a>.
    Seventeen years of software. Two companies co-founded, one acquired after raising $3.7M with
    Comcast Ventures leading and scaling to 5M lifetime users. Today I own every layer of two live AI products — and I direct and
    verify software built largely by AI coding agents.</p>
    <h2>Two products. Both live.</h2>
    <p><a href="https://consilo.ai">Consilo</a> — the AI operating system for a small business:
    autonomous agents for email, social and calendar, an AI Council running four frontier models
    against one strategic question in parallel, and a generation suite grounded in the customer's
    own context. My build: multi-model routing over OpenRouter, the pgvector retrieval store, and
    the agent runtime.</p>
    <p><a href="https://variotype.com">Variotype</a> — an AI product designer: it studies your
    users, gathers inspiration and creates several fully coded design directions tailored to them. My build: the
    parallel generation pipeline with SSE streaming, an isolated containerised render service, and
    an OAuth-secured MCP server exposing the design system to coding agents.</p>
    <h2>Agents carry the build. The release gate stays human.</h2>
    <h2>The system every codebase runs on.</h2>
    <p>The OGP Labs engineering toolkit: one repository of workflow skills, architecture patterns,
    service-integration guides and engineering rules that every OGP Labs codebase runs on, with a
    review feedback loop that turns repeated defects into enforced guardrails. 492 commits and 204
    merged pull requests, 24 Apr – 12 Nov 2026.</p>
    <h2>Seventeen years, mostly at the architecture end.</h2>
    <h2>A boring, proven stack — plus the AI layer on top.</h2>
    <h2>A city you can actually drive. A script you can finally read.</h2>
    <p><a href="https://babu.work/trivandrum-night-drive/">Trivandrum Night Drive</a> — 415 km² of
    the real Thiruvananthapuram, baked out of OpenStreetMap into a single file with no framework,
    no bundler and no dependencies.</p>
    <p><a href="https://babu.work/tamal/">Tamal</a> — a Chrome extension and web page that rewrite
    Malayalam script as Tamil script, so Tamil readers can read Malayalam. It runs entirely in the
    browser, with no model and no network calls.</p>
    <h2>Building something that has to be right the first time?</h2>
    <p>A message on <a href="https://linkedin.com/in/babusomasundaram">LinkedIn</a> reaches me
    directly, or read the <a href="/Babu-Somasundaram-Resume.pdf">résumé (PDF)</a>.</p>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to

ch;font-size:14px;line-height:1.65;color:rgba(var(--on-rgb),.7)\">Commits, merges and tests counted from git and the test suites of both OGP Labs codebases. Prompts, agent turns and tokens counted from Claude Code session transcripts for Feb – 11 Aug and 12 Oct – 13 Nov 2026; the weeks between were not retained, so those are floors. Engineering is mine end to end; product and design with my co-founder.<\u002Fp>\n    <\u002Fsection>\n\n    <section id=\"products\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:24ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">Two products. <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">Both live.<\u002Fspan><\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">01 — Work<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(14px,1.6vw,20px)\">\n        <article data-reveal=\"\" style=\"position:relative;overflow:hidden;border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accent-rgb),.12),rgba(var(--ov-rgb),.02) 55%);padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:20px;transition:border-color .25s ease,transform .4s cubic-bezier(.16,.84,.44,1)\" style-hover=\"border-color:rgba(var(--accent-rgb),.45);transform:translateY(-5px)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\">consilo.ai<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:om-live 2.4s ease-in-out infinite\"><\u002Fspan>Live<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;font-weight:600\">Consilo<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--body);text-wrap:pretty\">The AI operating system for a small business: autonomous agents for email, social and calendar; an AI Council running four frontier models against one strategic question in parallel; and a generation suite for documents, decks and media grounded in the customer's own context.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--text);text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">My build — <\u002Fspan>multi-model routing over OpenRouter, the pgvector retrieval store, and the agent runtime.<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(var(--ov-rgb),.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)\">\n            <span>7,119 commits<\u002Fspan><span>1,186 merges<\u002Fspan><span>13,405 tests<\u002Fspan><span>137,054+ agent turns<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://consilo.ai\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\" style-hover=\"color:var(--text-strong)\">Visit consilo.ai ↗<\u002Fa>\n        <\u002Farticle>\n        <article data-reveal=\"\" data-delay=\"100\" style=\"position:relative;overflow:hidden;border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accent-rgb),.12),rgba(var(--ov-rgb),.02) 55%);padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:20px;transition:border-color .25s ease,transform .4s cubic-bezier(.16,.84,.44,1)\" style-hover=\"border-color:rgba(var(--accent-rgb),.45);transform:translateY(-5px)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\">variotype.com<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:om-live 2.4s ease-in-out infinite\"><\u002Fspan>Live<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;font-weight:600\">Variotype<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--body);text-wrap:pretty\">An AI product designer: it studies your users, gathers inspiration and creates several fully coded design directions tailored to them — options to iterate on, review and share.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--text);text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">My build — <\u002Fspan>the parallel generation pipeline with SSE streaming, an isolated containerised render service, and an OAuth-secured MCP server exposing the design system to coding agents.<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(var(--ov-rgb),.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)\">\n            <span>3,277 commits<\u002Fspan><span>613 merges<\u002Fspan><span>3,999 tests<\u002Fspan><span>78,216+ agent turns<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://variotype.com\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\" style-hover=\"color:var(--text-strong)\">Visit variotype.com ↗<\u002Fa>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showProcess }}\" hint-placeholder-val=\"{{ true }}\">\n    <section id=\"method\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:28ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">Agents carry the build. The <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">release gate<\u002Fspan> stays human.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">02 — Method<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:clamp(14px,1.6vw,20px)\">\n        <sc-for list=\"{{ method }}\" as=\"m\" hint-placeholder-count=\"4\">\n          <div data-reveal=\"\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(var(--ov-rgb),.22);background:rgba(var(--ov-rgb),.055)\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)\">{{ m.no }}<\u002Fdiv>\n            <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">{{ m.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:15px;line-height:1.62;color:var(--body);text-wrap:pretty\">{{ m.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section id=\"toolkit\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:26ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">The <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">system<\u002Fspan> every codebase runs on.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">03 — Toolkit<\u002Fdiv>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:rgba(var(--ov-rgb),.022);padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:clamp(20px,2.4vw,28px)\">\n        <p style=\"margin:0;max-width:68ch;font-size:clamp(16px,1.5vw,18px);line-height:1.62;color:var(--light);text-wrap:pretty\">The products are what we ship; the toolkit is how. It is one repository holding the workflow skills, architecture patterns, service-integration guides and engineering rules that every OGP Labs codebase runs on. I designed and built it so agents can carry implementation while architecture, standards and the release gate stay with an engineer.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:22px 20px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"492\">492<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Commits<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"204\">204<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Merged pull requests<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"18\">18<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Workflow skills<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"35\">35<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Architecture & process patterns<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"16\">16<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Service-integration guides<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:clamp(26px,3vw,40px);line-height:1;letter-spacing:-.04em;font-weight:600;color:var(--accent)\" data-count=\"3700\" data-plus=\"1\">3,700+<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.5\">Review findings logged<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;color:var(--dim)\">Counted from the toolkit's git history and review ledgers, 24 Apr – 12 Nov 2026.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(14px,1.6vw,20px)\">\n        <div data-reveal=\"\" data-delay=\"0\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(var(--ov-rgb),.22);background:rgba(var(--ov-rgb),.055)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)\">01<\u002Fdiv>\n          <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">One install, every project<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.62;color:var(--body);text-wrap:pretty\">Skills are linked from one repository, patterns and service guides are read where they live, and templates are seeded once. A new codebase installs it with one command, and an improvement reaches every project on the next pull, with no fifty-file sync PRs.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"60\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(var(--ov-rgb),.22);background:rgba(var(--ov-rgb),.055)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)\">02<\u002Fdiv>\n          <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">Defects that stay fixed<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.62;color:var(--body);text-wrap:pretty\">Every review finding goes into an append-only ledger. A defect seen twice becomes a guardrail, in a file capped at 25 lines that agents read before their first edit. The cap is the mechanism: a rules file that only grows stops being read.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"120\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(var(--ov-rgb),.22);background:rgba(var(--ov-rgb),.055)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)\">03<\u002Fdiv>\n          <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">Unattended, not unsupervised<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.62;color:var(--body);text-wrap:pretty\">Batch runs settle every open decision up front, then send one isolated agent per ticket through to a stacked pull request. Nothing merges itself, and security review is always a step I start.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" data-delay=\"180\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(24px,2.6vw,32px);display:flex;flex-direction:column;gap:14px;transition:border-color .25s ease,background .3s ease\" style-hover=\"border-color:rgba(var(--ov-rgb),.22);background:rgba(var(--ov-rgb),.055)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--accent)\">04<\u002Fdiv>\n          <h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em;font-weight:600\">It learns from its projects<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.62;color:var(--body);text-wrap:pretty\">When a product codebase finds a better way, it goes back up as a reviewed pull request — 159 so far — and reaches every other codebase on the next pull.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"track\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:24ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">Seventeen years, mostly at the <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">architecture<\u002Fspan> end.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">04 — Track record<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:rgba(var(--ov-rgb),.022);overflow:hidden\">\n        <sc-for list=\"{{ roles }}\" as=\"role\" hint-placeholder-count=\"7\">\n          <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr);gap:clamp(14px,2.2vw,32px);padding:clamp(22px,2.4vw,30px) clamp(20px,2.6vw,34px);border-top:1px solid rgba(var(--ov-rgb),.07);transition:background .25s ease\" style-hover=\"background:rgba(var(--ov-rgb),.04)\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);padding-top:6px\">{{ role.years }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <h3 style=\"margin:0;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.025em;font-weight:600\">{{ role.title }}<\u002Fh3>\n              <div style=\"display:flex;flex-wrap:wrap;gap:4px 10px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);line-height:1.6\"><span>{{ role.org }}<\u002Fspan><span style=\"color:var(--faint)\">·<\u002Fspan><span style=\"color:var(--dim)\">{{ role.place }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ detailed }}\" hint-placeholder-val=\"{{ true }}\">\n                <ul style=\"margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ role.points }}\" as=\"point\" hint-placeholder-count=\"2\">\n                    <li style=\"font-size:15.5px;line-height:1.62;color:var(--body);padding-left:18px;position:relative;text-wrap:pretty\"><span style=\"position:absolute;left:0;top:0;color:var(--faint)\">—<\u002Fspan>{{ point }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr);gap:clamp(14px,2.2vw,32px);padding:clamp(22px,2.4vw,30px) clamp(20px,2.6vw,34px);border-top:1px solid rgba(var(--ov-rgb),.07)\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);padding-top:6px\">2005 – 2009<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <h3 style=\"margin:0;font-size:clamp(19px,2.2vw,24px);letter-spacing:-.025em;font-weight:600\">B.E. Computer Science<\u002Fh3>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);line-height:1.6\">Kamaraj College of Engineering &amp; Technology · Anna University <span style=\"color:var(--dim)\">· Chennai, India<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"stack\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:26ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">A boring, proven stack — plus the <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">AI layer<\u002Fspan> on top.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">05 — Stack<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(14px,1.6vw,20px)\">\n        <sc-for list=\"{{ stack }}\" as=\"group\" hint-placeholder-count=\"6\">\n          <div data-reveal=\"\" style=\"border:1px solid rgba(var(--ov-rgb),.09);border-radius:24px;background:rgba(var(--ov-rgb),.03);padding:clamp(22px,2.4vw,28px);display:flex;flex-direction:column;gap:16px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\">{{ group.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"8\">\n                <span style=\"font-size:13.5px;line-height:1.2;color:var(--light);border:1px solid rgba(var(--ov-rgb),.1);background:rgba(var(--ov-rgb),.02);padding:8px 12px;border-radius:999px;transition:border-color .2s ease,color .2s ease\" style-hover=\"border-color:rgba(var(--accent-rgb),.55);color:var(--accent)\">{{ item }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"drive\" style=\"padding-top:clamp(40px,6vw,80px);display:flex;flex-direction:column;gap:clamp(20px,2.6vw,32px)\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px\">\n        <h2 style=\"margin:0;max-width:30ch;font-size:clamp(28px,4vw,52px);line-height:1;letter-spacing:-.04em;font-weight:600\">A city you can <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">actually drive<\u002Fspan>.<br>A script you can <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;color:var(--accent)\">finally read<\u002Fspan>.<\u002Fh2>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">06 — Off the clock<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(16px,2vw,24px)\">\n        <article data-reveal=\"\" style=\"position:relative;overflow:hidden;border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accent-rgb),.12),rgba(var(--ov-rgb),.02) 55%);padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:20px;transition:border-color .25s ease,transform .4s cubic-bezier(.16,.84,.44,1)\" style-hover=\"border-color:rgba(var(--accent-rgb),.45);transform:translateY(-5px)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\">trivandrum night drive<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:om-live 2.4s ease-in-out infinite\"><\u002Fspan>Playable<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;font-weight:600\">415 km² of Thiruvananthapuram, in one file<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--body);text-wrap:pretty\">A top-down night drive over the real city, baked out of OpenStreetMap. Pick a start and a destination, follow the arrow, and the trail prints as a journey receipt — distance, detour ratio, time over the limit, landmarks passed. No framework, no bundler, no dependencies, and no network calls once it loads.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--text);text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">The point — <\u002Fspan>every line on that receipt is computed from geometry. The only generated sentence is the title. Knowing where a model earns its place is most of the job.<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(var(--ov-rgb),.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)\">\n            <span>31,702 road pieces<\u002Fspan><span>117,163 buildings<\u002Fspan><span>2,426 landmarks<\u002Fspan><span>0 dependencies<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://babu.work/trivandrum-night-drive/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\" style-hover=\"color:var(--text-strong)\">Drive it ↗ <span style=\"color:var(--muted);letter-spacing:.06em\">— 4.5 MB, best on wifi<\u002Fspan><\u002Fa>\n        <\u002Farticle>\n        <article data-reveal=\"\" style=\"position:relative;overflow:hidden;border:1px solid rgba(var(--ov-rgb),.09);border-radius:26px;background:radial-gradient(120% 90% at 0% 0%,rgba(var(--accent-rgb),.12),rgba(var(--ov-rgb),.02) 55%);padding:clamp(26px,3vw,38px);display:flex;flex-direction:column;gap:20px;transition:border-color .25s ease,transform .4s cubic-bezier(.16,.84,.44,1)\" style-hover=\"border-color:rgba(var(--accent-rgb),.45);transform:translateY(-5px)\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\">tamal<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;animation:om-live 2.4s ease-in-out infinite\"><\u002Fspan>Live<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.03em;font-weight:600\">Malayalam, in Tamil letters<\u002Fh3>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--body);text-wrap:pretty\">A Chrome extension and web page that rewrite Malayalam script as Tamil script, so a Tamil reader can read a Malayalam news page, song or WhatsApp forward out loud. The words stay Malayalam; only the letters change. It runs entirely in the browser: no server, no tracking, nothing sent anywhere.<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:var(--text);text-wrap:pretty\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)\">The point — <\u002Fspan>there is no model in it, on purpose. The two scripts share one Unicode layout, so the work is in the few letters Tamil lacks, and a rule you can test beats a guess you can't.<\u002Fp>\n          <div style=\"margin-top:auto;padding-top:20px;border-top:1px solid rgba(var(--ov-rgb),.09);display:flex;flex-wrap:wrap;gap:8px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)\">\n            <span>94-line converter<\u002Fspan><span>24 test cases<\u002Fspan><span>0 network calls<\u002Fspan><span>0 dependencies<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://babu.work/tamal/\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)\" style-hover=\"color:var(--text-strong)\">Read it ↗ <span style=\"color:var(--muted);letter-spacing:.06em\">— works on phones, no install<\u002Fspan><\u002Fa>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"contact\" style=\"margin-top:clamp(48px,7vw,96px);position:relative;overflow:hidden;border:1px solid rgba(var(--ov-rgb),.09);border-radius:28px;background:linear-gradient(180deg,rgba(var(--accent-rgb),.08),rgba(var(--ov-rgb),.015));padding:clamp(32px,4.4vw,72px);display:flex;flex-wrap:wrap;gap:clamp(28px,4vw,64px);justify-content:space ener(\"scroll\", this._onScroll);\n    if (this._onMove) document.removeEventListener(\"mousemove\", this._onMove);\n  }\n  runMotion() {\n    const bar = document.querySelector(\"[data-scrollbar]\");\n    if (bar) {\n      this._onScroll = () => {\n        const h = document.documentElement.scrollHeight - window.innerHeight;\n        bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + \"%\";\n      };\n      window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n      this._onScroll();\n    }\n\n    const reduce = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\n\n    if ((this.props.cursorGlow ?? true) && !reduce) {\n      const host = document.querySelector(\"[data-glow]\");\n      const layer = document.querySelector(\"[data-glowlayer]\");\n      if (host && layer) {\n        this._onMove = (e) => {\n          const r = host.getBoundingClientRect();\n          const x = ((e.clientX - r.left) / r.width) * 100;\n          const y = ((e.clientY - r.top) / r.height) * 100;\n          if (x < -10 || x > 110 || y < -10 || y > 110) return;\n          layer.style.background =\n            \"radial-gradient(460px circle at \" + x + \"% \" + y + \"%,rgba(var(--accent-rgb),.18),transparent 70%)\";\n        };\n        document.addEventListener(\"mousemove\", this._onMove, { passive: true });\n      }\n    }\n\n    if (reduce) return;\n    this._ios = [];\n    const ease = \"cubic-bezier(.16,.84,.44,1)\";\n    const reveals = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    reveals.forEach((el) => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(20px)\";\n      el.style.transition = \"opacity .8s \" + ease + \", transform .8s \" + ease;\n      el.style.willChange = \"opacity, transform\";\n    });\n    const show = (el, delay) =>\n      setTimeout(() => {\n        el.style.opacity = \"1\";\n        el.style.transform = \"none\";\n        setTimeout(() => {\n          el.style.willChange = \
